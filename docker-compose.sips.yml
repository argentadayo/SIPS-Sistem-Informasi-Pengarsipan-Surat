# ═══════════════════════════════════════════════════════════
# Arsip SIPS — Docker Compose (full stack)
# MySQL (sips_db) + API (Bun/Hono) + Web (Nginx) + OCR
# Project: arsip-sips — terpisah dari stack "arsip-surat"
# ═══════════════════════════════════════════════════════════
#
# Usage:
#   docker compose -f docker-compose.sips.yml up -d --build
#   # import dump (sekali):
#   docker compose -f docker-compose.sips.yml exec -T mysql-sips \
#     mysql -u root -p"$SIPS_MYSQL_ROOT_PASSWORD" sips_db < backups/sips_db.sql
#
# Port host: 3307 (MySQL) | ${WEB_PORT:-80} (web) | ${OCR_PORT:-8000} (OCR)
# Volume: sips_mysql_data, sips_upload_data, sips_temp_data
# Service name "api" dipakai nginx (docker/nginx/default.conf upstream api:3001).

name: arsip-sips

services:
  # ── MySQL (sips_db) ─────────────────────────────────────
  # CATATAN: blok ini sengaja TIDAK diubah agar config-hash tetap
  # sama dengan container sips-mysql yang sudah ada (tidak recreate).
  mysql-sips:
    image: mysql:8.4
    container_name: sips-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --performance-schema=OFF
      - --skip-name-resolve
    environment:
      # Wajib diisi di .env (fail-fast, tanpa default lemah)
      MYSQL_ROOT_PASSWORD: ${SIPS_MYSQL_ROOT_PASSWORD:?set SIPS_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SIPS_MYSQL_DATABASE:-sips_db}
      MYSQL_USER: ${SIPS_MYSQL_USER:-arsip}
      MYSQL_PASSWORD: ${SIPS_MYSQL_PASSWORD:?set SIPS_MYSQL_PASSWORD}
    volumes:
      - sips_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/arsip.cnf:ro
    # Bind localhost saja — tools di host tetap bisa akses, tidak expose ke publik
    ports:
      - "127.0.0.1:${SIPS_MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 512m
    mem_reservation: 256m
    security_opt:
      - no-new-privileges:true

  # ── API Hono + Bun ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: arsip-sips-api
    container_name: sips-api
    restart: unless-stopped
    depends_on:
      mysql-sips:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      # Web diakses lewat nginx (:80). Untuk domain publik, set SIPS_APP_URL/SIPS_WEB_URL.
      APP_URL: ${SIPS_APP_URL:-http://localhost}
      WEB_URL: ${SIPS_WEB_URL:-http://localhost}
      DATABASE_URL: mysql://${SIPS_MYSQL_USER:-arsip}:${SIPS_MYSQL_PASSWORD:-arsip_secret}@mysql-sips:3306/${SIPS_MYSQL_DATABASE:-sips_db}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      COOKIE_NAME: ${COOKIE_NAME:-arsip_session}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      UPLOAD_DIR: /app/storage/uploads
      TEMP_DIR: /app/storage/temp
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-5}
      RATE_LIMIT_UPLOAD_MAX: ${RATE_LIMIT_UPLOAD_MAX:-10}
      RATE_LIMIT_WINDOW_MS: 60000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Internal: OCR satu network (arsip-sips_default)
      OCR_SERVICE_URL: http://ocr:8000
    volumes:
      - sips_upload_data:/app/storage/uploads
      - sips_temp_data:/app/storage/temp
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 384m
    mem_reservation: 128m
    security_opt:
      - no-new-privileges:true

  # ── Web (Nginx + static React) ──────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: arsip-sips-web
    container_name: sips-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
    mem_limit: 64m
    mem_reservation: 32m
    security_opt:
      - no-new-privileges:true

  # ── OCR (PaddleOCR + LayoutLMv3, CPU) ───────────────────
  # Model TIDAK ada di image — di-mount read-only dari folder repo (dev/lokal).
  ocr:
    build:
      context: ./ocr
      dockerfile: Dockerfile
    image: arsip-surat-ocr
    container_name: arsip-ocr
    restart: unless-stopped
    environment:
      PORT: 8000
      MODEL_DIR: /models
      OCR_LANG: ${OCR_LANG:-id}
      OCR_MAX_IMAGE_BYTES: ${OCR_MAX_IMAGE_BYTES:-20971520}
    volumes:
      - ./layoutlmv3-bio-model:/models:ro
    # Bind localhost saja — service tanpa auth; API akses via network internal (http://ocr:8000)
    ports:
      - "127.0.0.1:${OCR_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    mem_limit: 2g
    mem_reservation: 512m
    security_opt:
      - no-new-privileges:true

volumes:
  sips_mysql_data:
    name: sips_mysql_data
  sips_upload_data:
    name: sips_upload_data
  sips_temp_data:
    name: sips_temp_data
